services:
  opc-simulator:
    build:
      context: .
      dockerfile: dockerfiles/Dev.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      OPCUA_HOST_IP: ${OPCUA_HOST_IP}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "4840:4840"

  nodered:
    build:
      context: .
      dockerfile: dockerfiles/NodeRED.Dockerfile
    image: opc-simulator-nodered:local
    restart: unless-stopped
    init: true
    depends_on:
      - opc-simulator
    environment:
      TZ: Europe/Oslo
      FLOWS: flows.json
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-opc-simulator-dashboard}
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
      - ./nodered/flows.json:/data/flows.json
      - ./nodered/settings.js:/data/settings.js:ro

volumes:
  node_modules:
  node_red_data:
